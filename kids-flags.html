<style>
.flag-display{font-size:120px;text-align:center;line-height:1;margin:12px 0;cursor:pointer;transition:transform .2s;}
.flag-display:active{transform:scale(.93);}
.flag-q{font-size:18px;font-weight:700;text-align:center;color:var(--text-muted);margin-bottom:12px;}
.flag-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:0 auto 12px;}
.flag-choice{padding:14px 10px;border-radius:12px;border:3px solid var(--border);background:var(--surface-2);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;}
.flag-choice:hover{border-color:var(--primary);transform:scale(1.03);}
.flag-choice.correct{background:#dcfce7;border-color:#22c55e;color:#15803d;}
.flag-choice.wrong{background:#fee2e2;border-color:#ef4444;color:#b91c1c;}
.flag-score{font-size:14px;font-weight:700;color:var(--text-muted);text-align:center;margin-bottom:6px;}
.flag-feedback{font-size:20px;font-weight:800;text-align:center;min-height:28px;}
.flag-done{text-align:center;padding:24px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:16px;border:2px solid #3b82f6;}
.flag-browse{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px;}
.flag-item{background:var(--surface-2);border-radius:10px;padding:10px 6px;text-align:center;font-size:13px;font-weight:700;}
.flag-item-emoji{font-size:32px;}
</style>

      <div class="flag-display" id="fFlag" onclick="speakCountry()">🏳️</div>

    </div>
  </div>

<script>
const FLAGS = [
  {flag:'🇴🇲',name:'Oman'},         {flag:'🇮🇳',name:'India'},
  {flag:'🇵🇰',name:'Pakistan'},      {flag:'🇧🇩',name:'Bangladesh'},
  {flag:'🇵🇭',name:'Philippines'},   {flag:'🇪🇬',name:'Egypt'},
  {flag:'🇯🇴',name:'Jordan'},        {flag:'🇸🇦',name:'Saudi Arabia'},
  {flag:'🇦🇪',name:'UAE'},           {flag:'🇬🇧',name:'UK'},
  {flag:'🇺🇸',name:'USA'},           {flag:'🇫🇷',name:'France'},
  {flag:'🇩🇪',name:'Germany'},       {flag:'🇮🇹',name:'Italy'},
  {flag:'🇯🇵',name:'Japan'},         {flag:'🇨🇳',name:'China'},
  {flag:'🇧🇷',name:'Brazil'},        {flag:'🇦🇺',name:'Australia'},
  {flag:'🇨🇦',name:'Canada'},        {flag:'🇷🇺',name:'Russia'},
  {flag:'🇹🇷',name:'Turkey'},        {flag:'🇰🇷',name:'South Korea'},
  {flag:'🇲🇽',name:'Mexico'},        {flag:'🇳🇱',name:'Netherlands'},
  {flag:'🇸🇬',name:'Singapore'},     {flag:'🇿🇦',name:'South Africa'},
  {flag:'🇦🇷',name:'Argentina'},     {flag:'🇮🇩',name:'Indonesia'},
  {flag:'🇲🇾',name:'Malaysia'},      {flag:'🇳🇬',name:'Nigeria'},
];

const TOTAL=20;
let score=0, qIdx=0, answered=false, questions=[];

function shuffle(a){return [...a].sort(()=>Math.random()-.5);}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

function pick3wrong(correct){
  return shuffle(FLAGS.filter(f=>f!==correct)).slice(0,3);
}

function startGame(){
  score=0; qIdx=0; answered=false;
  questions=shuffle(FLAGS).slice(0,TOTAL);
  renderQ();
}

let currentCountry='';
function speakCountry(){
  if(!currentCountry) return;
  if(window.speechSynthesis){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(currentCountry);
    u.lang='en-US'; u.rate=0.85;
    speechSynthesis.speak(u);
  }
}

function renderQ(){
  if(qIdx>=TOTAL){
    const pct=Math.round(score/TOTAL*100);
    const msg=pct>=90?'🌍 World Geography Expert!':pct>=70?'🗺️ Great job, Explorer!':pct>=50?'👍 Good effort! Play again!':'💪 Keep learning! You\'ll get there!';
    const stars='⭐'.repeat(Math.min(5,Math.ceil(pct/20)));
    document.getElementById('quizArea').innerHTML=`
      <div class="flag-done">
        <div style="font-size:60px;">🏆</div>
        <div style="font-size:22px;font-weight:900;color:#1e40af;margin:10px 0;">${msg}</div>
        <div style="font-size:20px;">${stars}</div>
        <div style="font-size:15px;color:var(--text-muted);margin:8px 0;">Score: ${score} / ${TOTAL} (${pct}%)</div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="startGame()">Play Again</button>
      </div>`;
    return;
  }
  const q=questions[qIdx];
  currentCountry=q.name;
  const choices=shuffle([q,...pick3wrong(q)]);
  document.getElementById('fScore').textContent=`Score: ${score} / ${TOTAL} | Q ${qIdx+1} of ${TOTAL}`;
  document.getElementById('fFlag').textContent=q.flag;
  document.getElementById('fChoices').innerHTML=choices.map(c=>
    `<button class="flag-choice" onclick="answerQ(this,'${c.name}','${q.name}')">${c.name}</button>`
  ).join('');
  document.getElementById('fFeedback').textContent='';
  answered=false;
}

function answerQ(btn,chosen,correct){
  if(answered) return;
  answered=true;
  if(chosen===correct){
    btn.classList.add('correct');
    score++;
    document.getElementById('fFeedback').textContent='✅ Correct!';
    if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(correct);u.lang='en-US';speechSynthesis.speak(u);}
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.flag-choice').forEach(b=>{if(b.textContent===correct) b.classList.add('correct');});
    document.getElementById('fFeedback').textContent=`❌ It's ${correct}`;
  }
  setTimeout(()=>{qIdx++;renderQ();},1000);
}

function buildBrowse(){
  document.getElementById('fBrowse').innerHTML=FLAGS.map(f=>
    `<div class="flag-item"><div class="flag-item-emoji">${f.flag}</div>${f.name}</div>`
  ).join('');
}

startGame();
buildBrowse();
</script>
