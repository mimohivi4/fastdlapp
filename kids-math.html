.km-level{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}

<script>
const EMOJIS = ['🍎','🌸','🚗','🎈','🌟','🍕','🐝','🦋','🌳','🐟'];
let level='easy', score=0, total=10, qIdx=0, answered=false, questions=[];

function setLevel(l){
  level=l;
  ['easy','medium','hard'].forEach(x=>{
    document.getElementById('lvl'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===l);
  });
  startGame();
}

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

function makeQ(){
  let max = level==='easy'?10:level==='medium'?20:50;
  const op = Math.random()>0.5 ? '+' : '-';
  let a,b;
  if(op==='+'){
    a=randInt(1,max-1); b=randInt(1,max-a);
  } else {
    a=randInt(2,max); b=randInt(1,a);
  }
  const ans = op==='+' ? a+b : a-b;
  return {a,b,op,ans};
}

function makeChoices(ans, max){
  const s=new Set([ans]);
  while(s.size<4){
    let v=ans+randInt(-5,5);
    if(v>=0&&v!==ans) s.add(v);
  }
  return [...s].sort(()=>Math.random()-.5);
}

function startGame(){
  score=0; qIdx=0; answered=false;
  questions=Array.from({length:total},makeQ);
  renderQ();
}

function renderQ(){
  if(qIdx>=total){
    const pct=Math.round(score/total*100);
    const msg=pct>=80?'🎉 Amazing! You\'re a Math Star!':pct>=50?'👍 Great job! Keep going!':'💪 Keep practicing!';
    document.getElementById('gameArea').innerHTML=`
      <div class="km-done">
        <div style="font-size:60px;">🏆</div>
        <div style="font-size:22px;font-weight:900;color:var(--primary);margin:10px 0;">${msg}</div>
        <div style="font-size:16px;color:var(--text-muted);">Score: ${score} / ${total} (${pct}%)</div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="startGame()">Play Again</button>
      </div>`;
    return;
  }
  const q=questions[qIdx];
  const emoji=EMOJIS[qIdx%EMOJIS.length];
  let visual='';
  if(q.op==='+'&&q.a+q.b<=20){
    visual=`<div>${emoji.repeat(q.a)}</div><div style="font-size:24px;">+</div><div>${emoji.repeat(q.b)}</div>`;
  } else if(q.op==='-'&&q.a<=20){
    visual=`<div>${emoji.repeat(q.a)}</div><div style="font-size:24px;">−</div><div style="text-decoration:line-through;opacity:.4;">${emoji.repeat(q.b)}</div>`;
  }
  const choices=makeChoices(q.ans, level==='easy'?10:level==='medium'?20:50);
  document.getElementById('kmScore').textContent=`Score: ${score} / ${total} | Question ${qIdx+1} of ${total}`;
  document.getElementById('kmVisual').innerHTML=visual;
  document.getElementById('kmQuestion').textContent=`${q.a} ${q.op==='+'?'+':'−'} ${q.b} = ?`;
  document.getElementById('kmChoices').innerHTML=choices.map(c=>
    `<button class="km-choice" onclick="answerQ(this,${c},${q.ans})">${c}</button>`
  ).join('');
  document.getElementById('kmFeedback').textContent='';
  answered=false;
}

function answerQ(btn,chosen,correct){
  if(answered) return;
  answered=true;
  if(chosen===correct){
    btn.classList.add('correct');
    score++;
    document.getElementById('kmFeedback').textContent='✅ Correct!';
    if(window.speechSynthesis){const u=new SpeechSynthesisUtterance('Correct!');u.lang='en-US';speechSynthesis.speak(u);}
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.km-choice').forEach(b=>{if(parseInt(b.textContent)===correct) b.classList.add('correct');});
    document.getElementById('kmFeedback').textContent=`❌ The answer is ${correct}`;
  }
  setTimeout(()=>{qIdx++;renderQ();},1000);
}

startGame();
</script>
