<script>
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function hexToRgb(h){h=h.replace('#','').trim();if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');if(!/^[0-9a-fA-F]{6}$/.test(h))return null;var n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2;if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);if(mx===r)h=(g-b)/d+(g<b?6:0);else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}return{h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)};}
function setAll(r,g,b){var hsl=rgbToHsl(r,g,b);var hex='#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1).toUpperCase();document.getElementById('hex').value=hex;document.getElementById('rgb').value='rgb('+r+', '+g+', '+b+')';document.getElementById('hsl').value='hsl('+hsl.h+', '+hsl.s+'%, '+hsl.l+'%)';document.getElementById('preview').style.background=hex;document.getElementById('picker').value=hex;palette(hsl.h,hsl.s,hsl.l);}
function palette(h,s,l){var w=document.getElementById('swatches');w.innerHTML='';[0,25,-25,40,-40].forEach(function(dl){var ll=clamp(l+dl,8,92);var c='hsl('+h+', '+s+'%, '+ll+'%)';var d=document.createElement('div');d.className='sw';d.style.background=c;d.title=c;d.onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(c);toast(c);};w.appendChild(d);});}
function toast(t){var b=document.getElementById('result');b.className='result-box show success';document.getElementById('cmsg').textContent='Copied '+t+' ✓';}
function copyV(el){el.select();try{navigator.clipboard.writeText(el.value);}catch(e){document.execCommand('copy');}toast(el.value);}
function fromPicker(v){var c=hexToRgb(v);if(c)setAll(c.r,c.g,c.b);}
function fromText(v){v=v.trim();if(!v)return;var c=null;if(v[0]==='#'){c=hexToRgb(v);}else{var m=v.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);if(m)c={r:clamp(+m[1],0,255),g:clamp(+m[2],0,255),b:clamp(+m[3],0,255)};}if(c)setAll(c.r,c.g,c.b);}
fromPicker('#4f46e5');
(function(){var r=document.documentElement,b=document.getElementById('darkToggle');try{if(localStorage.getItem('theme')==='dark'){r.classList.add('dark');b.textContent='☀️';}}catch(e){}b.addEventListener('click',function(){var d=r.classList.toggle('dark');b.textContent=d?'☀️':'🌙';try{localStorage.setItem('theme',d?'dark':'light');}catch(e){}});})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
