<div class="card" id="calc">
<div class="card-icon" style="background:#f0fdf4;">🔤</div>
<h1 class="card-title">Конвертер регистра</h1>
<div class="card-subtitle">Меняйте регистр + счётчик — мгновенно</div>
<div class="divider"></div>
<label for="tin">Ваш текст</label>
<textarea id="tin" placeholder="Введите или вставьте текст..." oninput="count()" spellcheck="false"></textarea>
<div class="option-toggle">
<button class="option-btn" onclick="c('upper')">ЗАГЛАВНЫЕ ABC</button>
<button class="option-btn" onclick="c('lower')">строчные abc</button>
<button class="option-btn" onclick="c('title')">Заголовки</button>
</div>
<div class="option-toggle" style="margin-top:8px;">
<button class="option-btn" onclick="c('sentence')">Предложения</button>
<button class="option-btn" onclick="c('alt')">чЕрЕдОвАнИе</button>
<button class="option-btn" onclick="c('inverse')">иНВЕРСИЯ</button>
</div>
<div class="stat-grid">
<div class="stat-box"><div class="stat-val" id="wWords">0</div><div class="stat-lbl">Слова</div></div>
<div class="stat-box"><div class="stat-val" id="wChars">0</div><div class="stat-lbl">Символы</div></div>
<div class="stat-box"><div class="stat-val" id="wLines">0</div><div class="stat-lbl">Строки</div></div>
<div class="stat-box"><div class="stat-val" id="wRead">0s</div><div class="stat-lbl">Чтение</div></div>
</div>
<div class="btn-row"><button class="btn btn-secondary" onclick="copyT()">📋 Копировать</button><button class="btn btn-secondary" onclick="clr()">Очистить</button></div>
</div>

<script>
function count(){var v=document.getElementById('tin').value;var w=v.trim()?v.trim().split(/\s+/).length:0;document.getElementById('wWords').textContent=w;document.getElementById('wChars').textContent=v.length;document.getElementById('wLines').textContent=v?v.split('\n').length:0;document.getElementById('wRead').textContent=Math.ceil(w/200*60)+'s';}
function c(m){var el=document.getElementById('tin'),v=el.value;if(m==='upper')el.value=v.toUpperCase();else if(m==='lower')el.value=v.toLowerCase();else if(m==='title')el.value=v.toLowerCase().replace(/(?:^|\s|[.!?]\s+)(\S)/g,function(x){return x.toUpperCase();});else if(m==='sentence')el.value=v.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g,function(x){return x.toUpperCase();});else if(m==='alt')el.value=v.split('').map(function(ch,i){return i%2?ch.toUpperCase():ch.toLowerCase();}).join('');else if(m==='inverse')el.value=v.split('').map(function(ch){return ch===ch.toUpperCase()?ch.toLowerCase():ch.toUpperCase();}).join('');count();}
function copyT(){var t=document.getElementById('tin');t.select();try{navigator.clipboard.writeText(t.value);}catch(e){document.execCommand('copy');}}
function clr(){document.getElementById('tin').value='';count();}
count();
(function(){var r=document.documentElement,b=document.getElementById('darkToggle');try{if(localStorage.getItem('theme')==='dark'){r.classList.add('dark');b.textContent='☀️';}}catch(e){}b.addEventListener('click',function(){var d=r.classList.toggle('dark');b.textContent=d?'☀️':'🌙';try{localStorage.setItem('theme',d?'dark':'light');}catch(e){}});})();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
