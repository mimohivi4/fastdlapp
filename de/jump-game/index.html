<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 380, H = 320;
const GRAVITY = 0.55, JUMP_V = -12.5;
const STORAGE_KEY = 'adawati_jump_lb';
const MEDALS=['🥇','🥈','🥉'], MEDAL_CLS=['gold','silver','bronze'];

const JT = {
  ar:{points:'نقاط',stars:'⭐ نجوم',best:'أفضل',jump:'⬆ اقفز!',
      top3:'🏆 أفضل 3 لاعبين',clear:'🗑 مسح',no_scores:'لا توجد نتائج بعد!',
      top3_enter:'🏆 دخلت أفضل 3! اكتب اسمك:',your_name:'اسمك',save:'💾 حفظ',
      game_title:'لعبة القفز!',press_start:'اضغط قفز أو مسّ الشاشة للبدء',start:'▶ ابدأ',
      game_over:'انتهت اللعبة!',score_lbl:'نقاط',play_again:'▶ مجدداً'},
  en:{points:'Points',stars:'⭐ Stars',best:'Best',jump:'⬆ Jump!',
      top3:'🏆 Top 3 Jumpers',clear:'🗑 Clear',no_scores:'No scores yet!',
      top3_enter:'🏆 Top 3! Enter your name:',your_name:'Your name',save:'💾 Save',
      game_title:'Jump Game!',press_start:'Press SPACE or tap to start',start:'▶ Start',
      game_over:'Game Over!',score_lbl:'Score',play_again:'▶ Again'},
  fr:{points:'Points',stars:'⭐ Étoiles',best:'Meilleur',jump:'⬆ Sauter!',
      top3:'🏆 Top 3 Sauteurs',clear:'🗑 Effacer',no_scores:'Aucun score!',
      top3_enter:'🏆 Top 3! Votre prénom:',your_name:'Votre prénom',save:'💾 Sauver',
      game_title:'Jeu de Saut!',press_start:'Appuyez ESPACE ou touchez',start:'▶ Démarrer',
      game_over:'Jeu Terminé!',score_lbl:'Score',play_again:'▶ Rejouer'},
  es:{points:'Puntos',stars:'⭐ Estrellas',best:'Mejor',jump:'⬆ Saltar!',
      top3:'🏆 Top 3 Saltadores',clear:'🗑 Borrar',no_scores:'¡Sin puntuaciones!',
      top3_enter:'🏆 Top 3! Tu nombre:',your_name:'Tu nombre',save:'💾 Guardar',
      game_title:'¡Juego de Salto!',press_start:'Pulsa ESPACIO o toca',start:'▶ Iniciar',
      game_over:'¡Juego Terminado!',score_lbl:'Puntos',play_again:'▶ De nuevo'},
  de:{points:'Punkte',stars:'⭐ Sterne',best:'Beste',jump:'⬆ Springen!',
      top3:'🏆 Top 3 Springer',clear:'🗑 Löschen',no_scores:'Noch keine Punkte!',
      top3_enter:'🏆 Top 3! Dein Name:',your_name:'Dein Name',save:'💾 Speichern',
      game_title:'Sprungspiel!',press_start:'LEERTASTE oder Tippen',start:'▶ Starten',
      game_over:'Spiel vorbei!',score_lbl:'Punkte',play_again:'▶ Nochmal'},
  ru:{points:'Очки',stars:'⭐ Звёзды',best:'Лучший',jump:'⬆ Прыгать!',
      top3:'🏆 Топ 3 Прыгунов',clear:'🗑 Очистить',no_scores:'Нет результатов!',
      top3_enter:'🏆 Топ 3! Введите имя:',your_name:'Ваше имя',save:'💾 Сохранить',
      game_title:'Игра-прыжок!',press_start:'Пробел или коснитесь экрана',start:'▶ Старт',
      game_over:'Игра окончена!',score_lbl:'Очки',play_again:'▶ Ещё раз'},
};
function tr(k){return(JT[currentLang]||JT.ar)[k]||JT.ar[k]||k;}
function updateText(){
  document.getElementById('scoreLbl').textContent=tr('points');
  document.getElementById('starsLbl').textContent=tr('stars');
  document.getElementById('bestLbl').textContent=tr('best');
  document.getElementById('jumpBtn').textContent=tr('jump');
  document.getElementById('saveBtn').textContent=tr('save');
  document.getElementById('nameInput').placeholder=tr('your_name');
  renderLb();
}
function resizeCanvas(){
  const w=Math.min(W,canvas.parentElement.offsetWidth||W);
  canvas.style.width=w+'px';
  canvas.style.height=Math.round(w*H/W)+'px';
}

let currentLang = 'ar';
let state = 'idle', rafId = null;
let score = 0, stars = 0, camX = 0, speed = 3, spawnX = W+100;
let pendingScore = null;

const PLATFORM_COLORS = ['#22c55e','#3b82f6','#f59e0b','#8b5cf6','#ef4444'];
const PLATFORM_H = 14;
const GROUND_Y = H - 40;

const player = {x:80, y:GROUND_Y-52, vy:0, w:34, h:42, jumpsLeft:2, onGround:false};
let platforms = [], starObjs = [], particles = [];

function resetGame(){
  score=0; stars=0; camX=0; speed=3; spawnX=W+80;
  player.x=80; player.y=GROUND_Y-52; player.vy=0; player.jumpsLeft=2; player.onGround=false;
  platforms=[
    {x:0, y:GROUND_Y, w:W+200, h:PLATFORM_H, color:'#166534'},
    {x:400, y:GROUND_Y-80, w:120, h:PLATFORM_H, color:'#22c55e'},
    {x:580, y:GROUND_Y-40, w:100, h:PLATFORM_H, color:'#3b82f6'},
  ];
  starObjs=[]; particles=[];
}

function spawnPlatforms(){
  while(spawnX < camX + W + 400){
    const gap = 60 + Math.random()*(30 + Math.min(score/50, 60));
    const pw  = Math.max(60, 140 - Math.min(score/40, 80));
    const py  = GROUND_Y - 40 - Math.random()*100;
    const clr = PLATFORM_COLORS[Math.floor(Math.random()*PLATFORM_COLORS.length)];
    platforms.push({x:spawnX, y:py, w:pw, h:PLATFORM_H, color:clr});
    // Maybe add a star
    if(Math.random()<0.5) starObjs.push({x:spawnX+pw/2, y:py-28, collected:false});
    spawnX += gap + pw;
  }
}

function jump(){
  if(player.jumpsLeft>0){
    player.vy = JUMP_V * (player.jumpsLeft===2?1:0.85);
    player.jumpsLeft--;
    player.onGround=false;
    // particle burst
    for(let i=0;i<8;i++) particles.push({x:player.x+player.w/2, y:player.y+player.h, vx:(Math.random()-0.5)*4, vy:-Math.random()*3-1, life:18, color:'#fbbf24'});
  }
}

function update(){
  speed = 3 + Math.min(score/200, 5);
  camX += speed;
  spawnPlatforms();

  // Gravity
  player.vy += GRAVITY;
  player.y += player.vy;
  player.onGround = false;

  // Platform collision
  platforms.forEach(p=>{
    const px = p.x - camX;
    if(player.vy>=0 &&
       player.x+player.w-4 > px &&
       player.x+4 < px+p.w &&
       player.y+player.h >= p.y &&
       player.y+player.h <= p.y+p.h+player.vy+2){
      player.y = p.y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.jumpsLeft = 2;
    }
  });

  // Fall death
  if(player.y > H+60){ onGameOver(); return; }

  // Stars
  starObjs.forEach(s=>{
    if(!s.collected && Math.abs((s.x-camX)-player.x-player.w/2)<30 && Math.abs(s.y-player.y-player.h/2)<30){
      s.collected=true; stars++;
      for(let i=0;i<10;i++) particles.push({x:s.x-camX, y:s.y, vx:(Math.random()-0.5)*5, vy:-Math.random()*4-1, life:22, color:'#fbbf24'});
    }
  });

  // Particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;});
  particles=particles.filter(p=>p.life>0);

  // Cleanup
  const cullX = camX - 200;
  platforms=platforms.filter(p=>p.x+p.w>cullX);
  starObjs=starObjs.filter(s=>s.x>cullX);

  score = Math.floor(camX/10);
}

function drawSky(){
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#bfdbfe');grad.addColorStop(1,'#e0f2fe');
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  // Clouds
  [[60,40,3],[180,25,2],[300,55,2.5]].forEach(([cx,cy,sc])=>{
    const ox=(camX*0.12)%W;
    const x=((cx-ox%W)+W)%W;
    ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.beginPath();ctx.arc(x,cy,18*sc,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x+22*sc,cy+5,14*sc,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x-18*sc,cy+5,12*sc,0,Math.PI*2);ctx.fill();
  });
}

function draw(){
  drawSky();
  // Ground fill
  ctx.fillStyle='#166534';ctx.fillRect(0,GROUND_Y+PLATFORM_H,W,H-GROUND_Y-PLATFORM_H);

  // Platforms
  platforms.forEach(p=>{
    const px=p.x-camX;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.roundRect(px,p.y,p.w,p.h,4);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.fillRect(px+4,p.y+2,p.w-8,4);
  });

  // Stars
  starObjs.filter(s=>!s.collected).forEach(s=>{
    ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⭐',s.x-camX,s.y+Math.sin(Date.now()/400)*3);
  });

  // Particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/22;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  // Player (superhero)
  ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText('🦸',player.x+player.w/2,player.y+player.h);

  // HUD
  document.getElementById('scoreDisplay').textContent=score;
  document.getElementById('starsDisplay').textContent=stars;
  document.getElementById('bestDisplay').textContent=getBest();
}

function drawOverlay(title,sub,btn){
  ctx.fillStyle='rgba(0,0,0,.68)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fff';ctx.font='bold 24px system-ui,sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(title,W/2,H/2-60);
  ctx.font='16px system-ui,sans-serif';ctx.fillStyle='#bbf7d0';
  ctx.fillText(sub,W/2,H/2-25);
  ctx.fillStyle='#22c55e';ctx.beginPath();ctx.roundRect(W/2-70,H/2+10,140,42,8);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 15px system-ui,sans-serif';
  ctx.fillText(btn,W/2,H/2+31);
}

function gameLoop(){
  if(state!=='playing')return;
  update();draw();
  rafId=requestAnimationFrame(gameLoop);
}

function pauseGame(){
  if(state!=='playing') return;
  state='paused';
  cancelAnimationFrame(rafId);
}
function resumeGame(){
  if(state!=='paused') return;
  state='playing';
  rafId=requestAnimationFrame(gameLoop);
}

function startGame(){
  state='playing';resetGame();
  cancelAnimationFrame(rafId);
  document.getElementById('nameEntry').style.display='none';
  canvas.onclick=null;
  rafId=requestAnimationFrame(gameLoop);
}

function onGameOver(){
  state='over';
  cancelAnimationFrame(rafId);
  const sc=score+stars*5;
  const best=getBest();
  if(sc>best) localStorage.setItem('adawati_jump_best',sc);
  draw();
  const sub=`${tr('score_lbl')}: ${score}  ⭐${stars}`;
  setTimeout(()=>{
    drawOverlay(tr('game_over'),sub,tr('play_again'));
  },200);
  if(qualifies(sc)){
    pendingScore=sc;
    document.getElementById('nameEntryMsg').textContent=tr('top3_enter');
    document.getElementById('nameEntry').style.display='';
    setTimeout(()=>document.getElementById('nameInput').focus(),100);
  }
  if(typeof showHomePrompt==='function')showHomePrompt();
}

function getBest(){return parseInt(localStorage.getItem('adawati_jump_best')||'0');}
function getLb(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch{return[];}}
function saveLb(lb){localStorage.setItem(STORAGE_KEY,JSON.stringify(lb));}
function qualifies(sc){const lb=getLb();return lb.length<3||sc>lb[lb.length-1].score;}
function addEntry(n,sc){const lb=getLb();lb.push({name:n||'?',score:sc});lb.sort((a,b)=>b.score-a.score);lb.splice(3);saveLb(lb);}
function clearLb(){localStorage.removeItem(STORAGE_KEY);renderLb();}
function saveScore(){if(!pendingScore)return;addEntry(document.getElementById('nameInput').value.trim(),pendingScore);pendingScore=null;document.getElementById('nameEntry').style.display='none';document.getElementById('nameInput').value='';renderLb();}
function renderLb(){
  const lb=getLb();
  document.getElementById('lbTitle').textContent=tr('top3');
  document.getElementById('clearBtn').textContent=tr('clear');
  const rows=document.getElementById('lbRows');
  if(!lb.length){rows.innerHTML=`<div class="lb-empty">${tr('no_scores')}</div>`;return;}
  rows.innerHTML=lb.map((e,i)=>`<div class="lb-row ${MEDAL_CLS[i]||''}"><span class="lb-medal">${MEDALS[i]||''}</span><span class="lb-name">${e.name}</span><span class="lb-score">${e.score} pts</span></div>`).join('');
}

// Controls
document.getElementById('jumpBtn').addEventListener('pointerdown',e=>{e.preventDefault();if(state==='idle'||state==='over'||state==='paused')startGame();else jump();});
canvas.addEventListener('touchstart',e=>{e.preventDefault();if(state==='idle'||state==='over')startGame();else if(state==='playing')jump();},{passive:false});
canvas.addEventListener('click',()=>{if(state==='idle'||state==='over')startGame();});
document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){
    e.preventDefault();
    if(state==='idle'||state==='over'||state==='paused')startGame();else if(state==='playing')jump();
  }
});

document.addEventListener('DOMContentLoaded',()=>{
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  const origSet=window.setLang;
  window.setLang=function(lang){
    origSet&&origSet(lang);
    currentLang=lang;
    document.documentElement.dir=lang==='ar'?'rtl':'ltr';
    updateText();
    if(state==='idle') drawInitOverlay();
  };
  window.onLangChange=function(lang){currentLang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';updateText();if(state==='idle')drawInitOverlay();};
  // Pause on tab hide
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) pauseGame();
    else resumeGame();
  });
  updateText();
  drawInitOverlay();
});
function drawInitOverlay(){
  drawSky();
  ctx.font='34px serif';ctx.textAlign='center';ctx.textBaseline='bottom';
  ctx.fillText('🦸',player.x+player.w/2,player.y+player.h);
  drawOverlay(tr('game_title'),tr('press_start'),tr('start'));
}
</script>
