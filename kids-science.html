<link rel="stylesheet" href="style.css">
<style>
.sci-tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
.sci-tab{padding:9px 16px;border-radius:99px;border:2px solid transparent;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;background:var(--surface-2);color:var(--text);}
.sci-tab.active{background:var(--primary);color:#fff;}
.sci-card{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:20px;padding:20px;text-align:center;cursor:pointer;transition:transform .15s;margin-bottom:12px;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.sci-card:active{transform:scale(.97);}
.sci-icon{font-size:80px;line-height:1;margin-bottom:8px;}
.sci-name{font-size:24px;font-weight:900;color:var(--primary);margin-bottom:4px;}
.sci-fact{font-size:14px;color:var(--text-muted);font-weight:600;max-width:300px;}
.sci-nav{display:flex;gap:12px;justify-content:center;align-items:center;margin:8px 0;}
.sci-nav button{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);background:var(--surface-2);font-size:20px;cursor:pointer;font-family:inherit;}
.sci-nav button:hover{border-color:var(--primary);}
.sci-progress{font-size:14px;font-weight:700;color:var(--text-muted);}
/* Quiz */
.sci-q-text{font-size:20px;font-weight:800;text-align:center;color:var(--primary);margin:10px 0;}
.sci-choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:10px auto;}
.sci-choice{padding:14px 10px;border-radius:12px;border:3px solid var(--border);background:var(--surface-2);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;}
.sci-choice:hover{border-color:var(--primary);transform:scale(1.02);}
.sci-choice.correct{background:#dcfce7;border-color:#22c55e;color:#15803d;}
.sci-choice.wrong{background:#fee2e2;border-color:#ef4444;color:#b91c1c;}
</style>

<main><div class="tool-page">
  <div class="page-header"><a href="kids-learn.html">← Back to Kids</a></div>
  <div class="card">
    <div class="card-icon" style="background:#eff6ff;">🔬</div>
    <h1 class="card-title">Science Explorer</h1>
    <div class="card-subtitle">Solar System, Body & Nature — Ages 8–13</div>
    <div class="divider"></div>

    <div class="sci-tabs">
      <button class="sci-tab active" onclick="setSection('planets')" id="tabPlanets">🪐 Planets</button>
      <button class="sci-tab" onclick="setSection('body')" id="tabBody">🫀 Body</button>
      <button class="sci-tab" onclick="setSection('nature')" id="tabNature">🌿 Nature</button>
      <button class="sci-tab" onclick="setSection('quiz')" id="tabQuiz">🎯 Quiz</button>
    </div>

    <div id="learnArea">
      <div class="sci-card" onclick="speakCard()" id="sciCard">
        <div class="sci-icon" id="sciIcon">☀️</div>
        <div class="sci-name" id="sciName">Loading...</div>
        <div class="sci-fact" id="sciFact"></div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:8px;">🔊 Tap to hear</div>
      </div>
      <div class="sci-nav">
        <button onclick="prev()">◀</button>
        <div class="sci-progress" id="sciProg">1 / 9</div>
        <button onclick="next()">▶</button>
      </div>
    </div>

    <div id="quizArea" style="display:none;">
      <div style="font-size:14px;font-weight:700;color:var(--text-muted);text-align:center;margin-bottom:8px;" id="qScore">Score: 0 / 15</div>
      <div style="font-size:50px;text-align:center;" id="qIcon">🌍</div>
      <div class="sci-q-text" id="qText"></div>
      <div class="sci-choices" id="qChoices"></div>
      <div style="font-size:18px;font-weight:800;text-align:center;min-height:26px;" id="qFeedback"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <a href="kids-flags.html" class="btn" style="background:var(--surface-2);color:var(--text);text-decoration:none;">🌍 Flags Quiz</a>
      <a href="kids-learn.html" class="btn" style="background:var(--surface-2);color:var(--text);text-decoration:none;">🧒 All Kids Tools</a>
    </div>
  </div>
</div></main>

<script>
const DATA = {
  planets: [
    {icon:'☀️',name:'The Sun',fact:'The Sun is a star! It is 109 times wider than Earth and 4.6 billion years old.',q:'Is the Sun a star or a planet?',choices:['A star','A planet','A moon','A comet'],ans:'A star'},
    {icon:'🪨',name:'Mercury',fact:'Mercury is the closest planet to the Sun. A year on Mercury is only 88 Earth days!',q:'Which planet is closest to the Sun?',choices:['Mercury','Venus','Mars','Jupiter'],ans:'Mercury'},
    {icon:'🌡️',name:'Venus',fact:'Venus is the hottest planet at 465°C, even hotter than Mercury!',q:'Which is the hottest planet in our solar system?',choices:['Venus','Mercury','Mars','Saturn'],ans:'Venus'},
    {icon:'🌍',name:'Earth',fact:'Earth is the only planet known to have life. It is covered 71% by water.',q:'What percentage of Earth is covered by water?',choices:['71%','50%','90%','30%'],ans:'71%'},
    {icon:'🔴',name:'Mars',fact:'Mars is called the Red Planet. It has the tallest volcano in the solar system: Olympus Mons!',q:'What is Mars called?',choices:['The Red Planet','The Blue Planet','The Gas Giant','The Ice Planet'],ans:'The Red Planet'},
    {icon:'🪐',name:'Jupiter',fact:'Jupiter is the largest planet. It has a storm called the Great Red Spot bigger than Earth!',q:'Which is the largest planet?',choices:['Jupiter','Saturn','Neptune','Uranus'],ans:'Jupiter'},
    {icon:'🪐',name:'Saturn',fact:'Saturn has beautiful rings made of ice and rock. It is the second largest planet.',q:'Which planet has famous rings of ice and rock?',choices:['Saturn','Jupiter','Uranus','Neptune'],ans:'Saturn'},
    {icon:'🩵',name:'Uranus',fact:'Uranus spins on its side! Its axis is tilted at 98 degrees.',q:'Which planet spins on its side?',choices:['Uranus','Neptune','Saturn','Mars'],ans:'Uranus'},
    {icon:'🔵',name:'Neptune',fact:'Neptune is the farthest planet from the Sun. Winds there blow at 2,100 km/h!',q:'Which is the farthest planet from the Sun?',choices:['Neptune','Uranus','Pluto','Saturn'],ans:'Neptune'},
  ],
  body: [
    {icon:'🧠',name:'Brain',fact:'Your brain has about 86 billion neurons. It uses 20% of all your body\'s energy!',q:'How many neurons does the human brain have?',choices:['86 billion','1 million','1 billion','500 million'],ans:'86 billion'},
    {icon:'❤️',name:'Heart',fact:'Your heart beats about 100,000 times a day and pumps 5 litres of blood every minute.',q:'How many times does the heart beat per day?',choices:['100,000','1,000','10,000','1 million'],ans:'100,000'},
    {icon:'🫁',name:'Lungs',fact:'You have 2 lungs. They hold about 6 litres of air and you breathe 20,000 times a day!',q:'How many litres of air can your lungs hold?',choices:['6 litres','1 litre','10 litres','20 litres'],ans:'6 litres'},
    {icon:'🦴',name:'Skeleton',fact:'Adults have 206 bones! Babies are born with about 270 bones — some fuse together.',q:'How many bones does an adult human have?',choices:['206','300','100','270'],ans:'206'},
    {icon:'👁️',name:'Eyes',fact:'Your eyes can see about 10 million colours. They have over 120 million light receptors!',q:'How many colours can human eyes see?',choices:['10 million','1,000','100,000','1 million'],ans:'10 million'},
    {icon:'🦷',name:'Teeth',fact:'Adults have 32 teeth. Teeth are the hardest substance in your body!',q:'How many teeth does an adult have?',choices:['32','20','28','36'],ans:'32'},
  ],
  nature: [
    {icon:'💧',name:'Water',fact:'Water covers 71% of Earth. Only 3% of all water is fresh (drinkable) water.',q:'What % of Earth\'s water is fresh water?',choices:['3%','50%','71%','25%'],ans:'3%'},
    {icon:'🌳',name:'Trees',fact:'Trees produce oxygen. One large tree can produce enough oxygen for 2 people per day!',q:'How many people can one tree provide oxygen for per day?',choices:['2 people','10 people','50 people','100 people'],ans:'2 people'},
    {icon:'🌈',name:'Rainbow',fact:'Rainbows are circles! We usually see half a circle because the ground blocks the rest.',q:'What shape is a complete rainbow?',choices:['A circle','A semicircle','A line','A square'],ans:'A circle'},
    {icon:'⚡',name:'Lightning',fact:'Lightning is 5 times hotter than the surface of the Sun — about 30,000°C!',q:'How hot is lightning?',choices:['30,000°C','1,000°C','100°C','5,000°C'],ans:'30,000°C'},
    {icon:'🌊',name:'Oceans',fact:'The ocean is about 3,688 metres deep on average. The Mariana Trench is 11 km deep!',q:'How deep is the deepest ocean trench?',choices:['11 km','5 km','3 km','1 km'],ans:'11 km'},
    {icon:'🔥',name:'Volcanoes',fact:'There are about 1,500 active volcanoes on Earth. Most are under the ocean!',q:'How many active volcanoes are on Earth?',choices:['1,500','50','5,000','100'],ans:'1,500'},
  ]
};

let section='planets', idx=0, quizQ=[], qIdx=0, qScore=0, qAnswered=false;

function setSection(s){
  section=s;
  idx=0;
  ['planets','body','nature','quiz'].forEach(x=>{
    document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===s);
  });
  if(s==='quiz'){
    document.getElementById('learnArea').style.display='none';
    document.getElementById('quizArea').style.display='';
    startQuiz();
  } else {
    document.getElementById('learnArea').style.display='';
    document.getElementById('quizArea').style.display='none';
    renderCard();
  }
}

function renderCard(){
  const d=DATA[section];
  const item=d[idx];
  document.getElementById('sciCard').style.background=
    section==='planets'?'linear-gradient(135deg,#0f172a,#1e3a5f)':
    section==='body'?'linear-gradient(135deg,#fff1f2,#fecdd3)':
    'linear-gradient(135deg,#f0fdf4,#bbf7d0)';
  document.getElementById('sciIcon').textContent=item.icon;
  document.getElementById('sciName').style.color=section==='planets'?'#93c5fd':'var(--primary)';
  document.getElementById('sciName').textContent=item.name;
  document.getElementById('sciFact').style.color=section==='planets'?'#cbd5e1':'var(--text-muted)';
  document.getElementById('sciFact').textContent=item.fact;
  document.getElementById('sciProg').textContent=`${idx+1} / ${d.length}`;
}

function speakCard(){
  const item=DATA[section][idx];
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(`${item.name}. ${item.fact}`);
  u.lang='en-US'; u.rate=0.85;
  speechSynthesis.speak(u);
}

function prev(){const d=DATA[section];idx=(idx-1+d.length)%d.length;renderCard();}
function next(){const d=DATA[section];idx=(idx+1)%d.length;renderCard();}

function startQuiz(){
  const all=[...DATA.planets,...DATA.body,...DATA.nature];
  quizQ=[...all].sort(()=>Math.random()-.5).slice(0,15);
  qIdx=0; qScore=0; qAnswered=false;
  renderQuiz();
}

function renderQuiz(){
  if(qIdx>=quizQ.length){
    const pct=Math.round(qScore/quizQ.length*100);
    document.getElementById('quizArea').innerHTML=`
      <div style="text-align:center;padding:24px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:16px;">
        <div style="font-size:60px;">🔭</div>
        <div style="font-size:22px;font-weight:900;color:var(--primary);margin:10px 0;">${pct>=80?'🏆 Science Genius!':pct>=50?'👍 Good scientist!':'💪 Keep exploring!'}</div>
        <div style="font-size:15px;color:var(--text-muted);">Score: ${qScore} / ${quizQ.length} (${pct}%)</div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="startQuiz()">Play Again</button>
      </div>`;
    return;
  }
  const q=quizQ[qIdx];
  document.getElementById('qScore').textContent=`Score: ${qScore} / ${quizQ.length} | Q ${qIdx+1} of ${quizQ.length}`;
  document.getElementById('qIcon').textContent=q.icon;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('qChoices').innerHTML=q.choices.map(c=>
    `<button class="sci-choice" onclick="answerQuiz(this,'${c.replace(/'/g,"\\'")}','${q.ans.replace(/'/g,"\\'")}')">${c}</button>`
  ).join('');
  document.getElementById('qFeedback').textContent='';
  qAnswered=false;
}

function answerQuiz(btn,chosen,correct){
  if(qAnswered) return;
  qAnswered=true;
  if(chosen===correct){btn.classList.add('correct');qScore++;document.getElementById('qFeedback').textContent='✅ Correct!';}
  else{btn.classList.add('wrong');document.querySelectorAll('.sci-choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct');});document.getElementById('qFeedback').textContent=`❌ ${correct}`;}
  setTimeout(()=>{qIdx++;renderQuiz();},1100);
}

renderCard();
</script>
<script>(function(){var r=document.documentElement,b=document.getElementById('darkToggle');if(!b)return;try{if(localStorage.getItem('theme')==='dark'){r.classList.add('dark');b.textContent='☀️';}}catch(e){}b.addEventListener('click',function(){var d=r.classList.toggle('dark');b.textContent=d?'☀️':'🌙';try{localStorage.setItem('theme',d?'dark':'light');}catch(e){}});if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}})();</script>
