<script>
let level='oclock', score=0, qIdx=0, answered=false, currentTime={h:0,m:0};
const TOTAL=10;

function setLevel(l){
  level=l;
  ['oclock','half','quarter'].forEach(x=>{
    const id=x==='oclock'?'lvlO':x==='half'?'lvlH':'lvlQ';
    document.getElementById(id).classList.toggle('active',x===l);
  });
  startGame();
}

function randTime(){
  const h=Math.floor(Math.random()*12)||12;
  let m=0;
  if(level==='half') m=Math.random()>0.5?30:0;
  if(level==='quarter'){const opts=[0,15,30,45];m=opts[Math.floor(Math.random()*4)];}
  return {h,m};
}

function fmt(h,m){
  return m===0?`${h}:00`:m<10?`${h}:0${m}`:`${h}:${m}`;
}

function readableTime(h,m){
  if(m===0) return `${h} o'clock`;
  if(m===30) return `half past ${h}`;
  if(m===15) return `quarter past ${h}`;
  if(m===45) return `quarter to ${h===12?1:h+1}`;
  return fmt(h,m);
}

function drawClock(h,m){
  const hDeg=(h%12)*30 + m*0.5;
  const mDeg=m*6;
  const hRad=(hDeg-90)*Math.PI/180;
  const mRad=(mDeg-90)*Math.PI/180;
  const hLen=45, mLen=60;
  const hx=100+hLen*Math.cos(hRad);
  const hy=100+hLen*Math.sin(hRad);
  const mx=100+mLen*Math.cos(mRad);
  const my=100+mLen*Math.sin(mRad);
  document.getElementById('hourHand').setAttribute('x2',hx);
  document.getElementById('hourHand').setAttribute('y2',hy);
  document.getElementById('minHand').setAttribute('x2',mx);
  document.getElementById('minHand').setAttribute('y2',my);
}

function wrongTimes(correct,n){
  const s=new Set([fmt(correct.h,correct.m)]);
  const opts=[0,15,30,45];
  let itr=0;
  while(s.size<n+1&&itr<100){
    itr++;
    const h=Math.floor(Math.random()*12)||12;
    let m=0;
    if(level==='half') m=Math.random()>0.5?30:0;
    else if(level==='quarter') m=opts[Math.floor(Math.random()*4)];
    const f=fmt(h,m);
    if(f!==fmt(correct.h,correct.m)) s.add(f);
  }
  return [...s].sort(()=>Math.random()-.5);
}

function startGame(){
  score=0; qIdx=0; answered=false;
  renderQ();
}

function renderQ(){
  if(qIdx>=TOTAL){
    const pct=Math.round(score/TOTAL*100);
    document.getElementById('gameArea').innerHTML=`
      <div class="clock-done">
        <div style="font-size:60px;">🏆</div>
        <div style="font-size:22px;font-weight:900;color:#15803d;margin:10px 0;">${pct>=80?'⏰ Clock Master!':pct>=50?'👍 Nice work!':'💪 Keep practicing!'}</div>
        <div style="font-size:15px;color:var(--text-muted);">Score: ${score} / ${TOTAL} (${pct}%)</div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="startGame()">Play Again</button>
      </div>`;
    return;
  }
  currentTime=randTime();
  const choices=wrongTimes(currentTime,3);
  drawClock(currentTime.h,currentTime.m);
  document.getElementById('cScore').textContent=`Score: ${score} / ${TOTAL} | Q ${qIdx+1} of ${TOTAL}`;
  document.getElementById('cChoices').innerHTML=choices.map(c=>
    `<button class="clock-choice" onclick="answerQ(this,'${c}','${fmt(currentTime.h,currentTime.m)}')">${c}</button>`
  ).join('');
  document.getElementById('cFeedback').textContent='';
  answered=false;
}

function answerQ(btn,chosen,correct){
  if(answered) return;
  answered=true;
  const rt=readableTime(currentTime.h,currentTime.m);
  if(chosen===correct){
    btn.classList.add('correct');
    score++;
    document.getElementById('cFeedback').textContent=`✅ ${rt}`;
    if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(`It is ${rt}`);u.lang='en-US';speechSynthesis.speak(u);}
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.clock-choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct');});
    document.getElementById('cFeedback').textContent=`❌ It's ${rt}`;
  }
  setTimeout(()=>{qIdx++;renderQ();},1100);
}

startGame();
</script>
