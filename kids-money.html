<script>
// Values in baisa (1 OMR = 1000 baisa)
const COINS = [
  {v:5,  label:'5 Bz',  color:'#a3a3a3', size:40, type:'coin'},
  {v:10, label:'10 Bz', color:'#94a3b8', size:44, type:'coin'},
  {v:25, label:'25 Bz', color:'#78716c', size:48, type:'coin'},
  {v:50, label:'50 Bz', color:'#b45309', size:52, type:'coin'},
  {v:100,label:'100 Bz',color:'#d97706', size:56, type:'coin'},
];
const NOTES = [
  {v:100,  label:'100 Bz', color:'#7c3aed', type:'note'},
  {v:200,  label:'200 Bz', color:'#2563eb', type:'note'},
  {v:500,  label:'500 Bz', color:'#047857', type:'note'},
  {v:1000, label:'1 OMR',  color:'#b91c1c', type:'note'},
  {v:5000, label:'5 OMR',  color:'#c2410c', type:'note'},
  {v:10000,label:'10 OMR', color:'#1e40af', type:'note'},
  {v:20000,label:'20 OMR', color:'#065f46', type:'note'},
];

const TOTAL=10;
let mode='coins', score=0, qIdx=0, answered=false, questions=[];

function setMode(m){
  mode=m;
  ['coins','notes','mixed'].forEach(x=>{
    document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===m);
  });
  startGame();
}

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}

function formatVal(v){
  if(v<1000) return v+'Bz';
  return (v/1000).toFixed(v%1000===0?0:3).replace(/\.?0+$/,'')+ ' OMR';
}

function makeQ(){
  let pool;
  if(mode==='coins') pool=COINS;
  else if(mode==='notes') pool=NOTES;
  else pool=[...COINS,...NOTES];

  const count=randInt(2,4);
  const picked=Array.from({length:count},()=>pool[randInt(0,pool.length-1)]);
  const total=picked.reduce((s,x)=>s+x.v,0);
  return {items:picked, total};
}

function makeChoices(correct){
  const s=new Set([correct]);
  const deltas=[50,100,250,500,1000,-50,-100,-250,-500];
  let itr=0;
  while(s.size<4&&itr<50){
    itr++;
    const d=deltas[randInt(0,deltas.length-1)];
    const v=correct+d;
    if(v>0&&!s.has(v)) s.add(v);
  }
  while(s.size<4) s.add(correct+randInt(100,500));
  return [...s].sort(()=>Math.random()-.5);
}

function startGame(){
  score=0; qIdx=0; answered=false;
  questions=Array.from({length:TOTAL},makeQ);
  renderQ();
}

function renderQ(){
  if(qIdx>=TOTAL){
    const pct=Math.round(score/TOTAL*100);
    document.getElementById('gameArea').innerHTML=`
      <div style="text-align:center;padding:24px;background:linear-gradient(135deg,#fef9c3,#fde68a);border-radius:16px;">
        <div style="font-size:60px;">💰</div>
        <div style="font-size:22px;font-weight:900;color:#92400e;margin:10px 0;">${pct>=80?'🏆 Money Master!':pct>=50?'👍 Great counting!':'💪 Keep practicing!'}</div>
        <div style="font-size:15px;color:var(--text-muted);">Score: ${score} / ${TOTAL} (${pct}%)</div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="startGame()">Play Again</button>
      </div>`;
    return;
  }
  const q=questions[qIdx];
  document.getElementById('mScore').textContent=`Score: ${score} / ${TOTAL} | Q ${qIdx+1} of ${TOTAL}`;

  const display=q.items.map(item=>{
    if(item.type==='coin'){
      return `<div class="coin" style="width:${item.size}px;height:${item.size}px;background:${item.color};">${item.label}</div>`;
    } else {
      return `<div class="note" style="background:${item.color};">${item.label}</div>`;
    }
  }).join('');
  document.getElementById('mDisplay').innerHTML=display;
  document.getElementById('mQ').textContent='Total = ?';

  const choices=makeChoices(q.total);
  document.getElementById('mChoices').innerHTML=choices.map(c=>
    `<button class="money-choice" onclick="answerQ(this,${c},${q.total})">${formatVal(c)}</button>`
  ).join('');
  document.getElementById('mFeedback').textContent='';
  answered=false;
}

function answerQ(btn,chosen,correct){
  if(answered) return;
  answered=true;
  if(chosen===correct){
    btn.classList.add('correct');score++;
    document.getElementById('mFeedback').textContent=`✅ Correct! ${formatVal(correct)}`;
    if(window.speechSynthesis){const u=new SpeechSynthesisUtterance('Correct!');u.lang='en-US';speechSynthesis.speak(u);}
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.money-choice').forEach(b=>{if(b.textContent===formatVal(correct))b.classList.add('correct');});
    document.getElementById('mFeedback').textContent=`❌ Answer: ${formatVal(correct)}`;
  }
  setTimeout(()=>{qIdx++;renderQ();},1100);
}

function buildRef(){
  const items=[...COINS,...NOTES];
  document.getElementById('mRef').innerHTML=items.map(item=>`
    <div class="money-ref-item">
      <div style="background:${item.color};border-radius:${item.type==='coin'?'50%':'6px'};width:${item.type==='coin'?'40px':'70px'};height:40px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;margin-bottom:4px;">${item.label}</div>
      <div>${item.label}</div>
      <div style="font-size:11px;color:var(--text-muted);">${formatVal(item.v)}</div>
    </div>
  `).join('');
}

startGame();
buildRef();
</script>
