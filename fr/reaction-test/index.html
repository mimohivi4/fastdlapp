let currentLang='en', currentLevel=0, completedLevels=[];
let roundNum=0, results=[], waitTimer=null, greenTimer=null, greenStart=0;
let state='idle', pendingScore=null; // states: idle | waiting | green | red | done

function tr(k){return(RT[currentLang]||RT.en)[k]||k;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getLb(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch{return[];}}
function saveLb(lb){localStorage.setItem(STORAGE_KEY,JSON.stringify(lb));}
function qualifies(level,avg){const lb=getLb();if(lb.length<3)return true;const l=lb[lb.length-1];return level>l.level||(level===l.level&&avg<l.avg);}
function addEntry(name,level,avg){const lb=getLb();lb.push({name:name.trim()||'?',level,avg});lb.sort((a,b)=>b.level-a.level||(a.level===b.level?a.avg-b.avg:0));lb.splice(3);saveLb(lb);}
function renderLb(){
  const lb=getLb(),t=RT[currentLang]||RT.en;
  document.getElementById('lbTitle').textContent=t.lbTitle;document.getElementById('clearBtn').textContent=t.lbClear;
  const rows=document.getElementById('lbRows');
  if(!lb.length){rows.innerHTML=`<div class="lb-empty">${t.lbEmpty}</div>`;return;}
  rows.innerHTML=lb.map((e,i)=>`<div class="lb-row ${MEDAL_CLS[i]||''}"><span class="lb-medal">${MEDALS[i]||''}</span><span class="lb-name">${esc(e.name)}</span><span class="lb-score">${t.lbScore.replace('{l}',e.level).replace('{a}',e.avg)}</span></div>`).join('');
}
function clearLb(){localStorage.removeItem(STORAGE_KEY);renderLb();}

  const t=RT[currentLang]||RT.en, lv=RT_LEVELS[currentLevel];
  document.getElementById('levelSteps').innerHTML=RT_LEVELS.map((_,i)=>`<div class="level-step ${i<currentLevel?'done':i===currentLevel?'active':''}"></div>`).join('');
  document.getElementById('levelEmoji').textContent=lv.emoji;
  document.getElementById('levelPill').textContent=`${t.levelLbl} ${currentLevel+1}`;
  document.getElementById('levelName').textContent=t.levelNames[currentLevel]||'';
  document.getElementById('difficultyHint').textContent=t['hint'+currentLevel]||'';
  document.getElementById('levelSelector').innerHTML=RT_LEVELS.map((l,i)=>`<button class="lvl-btn ${i===currentLevel?'current':completedLevels.includes(i)?'completed':''}" onclick="jumpToLevel(${i})">${l.emoji} ${i+1}</button>`).join('');
}

function renderDots(){
  const dots=document.getElementById('roundDots');
  dots.innerHTML=Array.from({length:ROUNDS},(_,i)=>{
    let cls='';
    if(i<results.length){cls=results[i].type==='good'?'done-right':results[i].type==='miss'||results[i].type==='early'?'done-wrong':'';}
    else if(i===roundNum) cls='current-dot';
    return `<div class="round-dot ${cls}"></div>`;
  }).join('');
}

function setBtn(cls,icon,sub){
  const btn=document.getElementById('reactBtn');
  btn.className='react-btn '+cls;
  document.getElementById('btnIcon').textContent=icon;
  document.getElementById('btnSub').textContent=sub;
}

function startLevel(lvIdx){
  currentLevel=Math.min(lvIdx,RT_LEVELS.length-1);
  roundNum=0;results=[];state='idle';pendingScore=null;
  clearTimeout(waitTimer);clearTimeout(greenTimer);
  document.getElementById('levelCompleteBox').classList.remove('show');
  document.getElementById('allDoneBox').classList.remove('show');
  document.getElementById('nameEntry').style.display='none';
  document.getElementById('rtList').innerHTML='';
  document.getElementById('avgDisplay').style.display='none';
  document.getElementById('avgLbl').style.display='none';
  renderLevelUI();renderDots();renderLb();
  setBtn('waiting','⏳',tr('wait'));
  setTimeout(()=>beginRound(),600);
}

function beginRound(){
  if(roundNum>=ROUNDS){onLevelComplete();return;}
  renderDots();
  const lv=RT_LEVELS[currentLevel];
  setBtn('waiting','⏳',tr('wait'));
  state='waiting';
  // Maybe show red flash first at higher levels
  const doRed=lv.redChance>0&&Math.random()<lv.redChance;
  const baseWait=lv.minWait+Math.random()*(lv.maxWait-lv.minWait);
  if(doRed){
    const redDelay=baseWait*0.4;
    const redDuration=400+Math.random()*300;
    waitTimer=setTimeout(()=>{
      if(state!=='waiting')return;
      state='red';
      setBtn('red-flash','🛑',tr('dontClick'));
      greenTimer=setTimeout(()=>{
        if(state!=='red')return;
        state='green';
        setBtn('waiting','⏳',tr('wait'));
        setTimeout(()=>showGreen(),redDuration+200+Math.random()*800);
      },redDuration);
    },redDelay);
  }else{
    waitTimer=setTimeout(()=>{if(state==='waiting')showGreen();},baseWait);
  }
}

function showGreen(){
  state='green';greenStart=performance.now();
  setBtn('ready','🟢',tr('go'));
  const lv=RT_LEVELS[currentLevel];
  greenTimer=setTimeout(()=>{if(state==='green'){state='done';onMiss();}},lv.greenWindow);
}

function onBtnClick(){
  if(state==='waiting'){
    clearTimeout(waitTimer);clearTimeout(greenTimer);
    state='done';
    setBtn('clicked-early','⚠️',tr('early'));
    results.push({type:'early',ms:0});
    renderResults();
    roundNum++;
    setTimeout(()=>beginRound(),1000);
  }else if(state==='red'){
    clearTimeout(waitTimer);clearTimeout(greenTimer);
    state='done';
    setBtn('clicked-early','⚠️',tr('early'));
    results.push({type:'early',ms:0});
    renderResults();
    roundNum++;
    setTimeout(()=>beginRound(),1000);
  }else if(state==='green'){
    clearTimeout(greenTimer);
    const ms=Math.round(performance.now()-greenStart);
    state='done';
    setBtn('result','✅',ms+' '+(RT[currentLang]||RT.en).msLabel);
    results.push({type:'good',ms});
    renderResults();
    roundNum++;
    setTimeout(()=>beginRound(),900);
  }
}

function onMiss(){
  setBtn('miss','❌',tr('miss'));
  results.push({type:'miss',ms:9999});
  renderResults();
  roundNum++;
  setTimeout(()=>beginRound(),900);
}

function renderResults(){
  const t=RT[currentLang]||RT.en;
  const list=document.getElementById('rtList');
  list.innerHTML=results.map(r=>{
    if(r.type==='good') return `<span class="rt-item good">${r.ms} ${t.msLabel}</span>`;
    if(r.type==='miss') return `<span class="rt-item miss">${t.miss}</span>`;
    return `<span class="rt-item early">${t.early}</span>`;
  }).join('');
  const goodMs=results.filter(r=>r.type==='good').map(r=>r.ms);
  if(goodMs.length>0){
    const avg=Math.round(goodMs.reduce((a,b)=>a+b,0)/goodMs.length);
    document.getElementById('avgDisplay').textContent=avg+' '+t.msLabel;
    document.getElementById('avgDisplay').style.display='block';
    document.getElementById('avgLbl').textContent=t.avgLbl;
    document.getElementById('avgLbl').style.display='block';
  }
}

function onLevelComplete(){
  if(!completedLevels.includes(currentLevel))completedLevels.push(currentLevel);
  const goodMs=results.filter(r=>r.type==='good').map(r=>r.ms);
  const avg=goodMs.length?Math.round(goodMs.reduce((a,b)=>a+b,0)/goodMs.length):9999;
  const t=RT[currentLang]||RT.en;
  const isLast=currentLevel===RT_LEVELS.length-1;
  if(isLast){
    const box=document.getElementById('allDoneBox');
    box.querySelector('.overlay-title').textContent=t.allDone;
    document.getElementById('allDoneSub').textContent=t.allDoneSub;
    document.getElementById('playAgainBtn').textContent=t.playAgain;
    box.classList.add('show');
  }else{
    const box=document.getElementById('levelCompleteBox');
    document.getElementById('lcTitle').textContent=t.lcTitle;
    document.getElementById('lcSub').textContent=t.lcSub.replace('{avg}',avg);
    document.getElementById('nextLevelBtn').textContent=t.nextLevel;
    document.getElementById('restartBtn').textContent=t.restart;
    box.classList.add('show');
  }
  if(qualifies(currentLevel+1,avg)){
    pendingScore={level:currentLevel+1,avg};
    document.getElementById('nameEntryMsg').textContent=t.lbNew;
    document.getElementById('nameInput').placeholder=t.lbPh;
    document.getElementById('saveBtn').textContent=t.lbSave;
    document.getElementById('nameEntry').style.display='';
    setTimeout(()=>document.getElementById('nameInput').focus(),100);
  }
  if(typeof showHomePrompt==='function')showHomePrompt();
  renderLevelUI();
}

function saveScore(){
  if(!pendingScore)return;
  const name=document.getElementById('nameInput').value.trim();
  addEntry(name||'?',pendingScore.level,pendingScore.avg);
  pendingScore=null;document.getElementById('nameEntry').style.display='none';document.getElementById('nameInput').value='';
  renderLb();
}
function nextLevel(){if(currentLevel<RT_LEVELS.length-1)startLevel(currentLevel+1);}
function restartAll(){completedLevels=[];startLevel(0);}
function jumpToLevel(i){startLevel(i);}

const _PAGE_LANG=document.documentElement.lang||'en';let _initDone=false;
document.addEventListener('DOMContentLoaded',()=>{
  currentLang=_PAGE_LANG;if(!RT[currentLang])currentLang='en';
  const origSet=window.setLang;
  window.setLang=function(lang){origSet&&origSet(lang);if(!_initDone&&lang!==_PAGE_LANG)return;currentLang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';renderLevelUI();renderLb();};
  window.onLangChange=function(lang){if(!_initDone&&lang!==_PAGE_LANG)return;currentLang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';renderLevelUI();renderLb();};
  // Clear pending timers when tab hides to avoid ghost clicks/misses
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden&&(state==='waiting'||state==='green'||state==='red')){
      clearTimeout(waitTimer);clearTimeout(greenTimer);waitTimer=null;greenTimer=null;
      // treat as a missed round so player knows they left
      if(state==='green'){onMiss();}
      else{state='idle';setBtn('waiting','⏳',tr('wait'));}
    }
  });
  startLevel(0);
  setTimeout(function(){_initDone=true;window.setLang(_PAGE_LANG);},0);
});
</script>
